<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b10">
<title>LAST SPARK — Containment Log</title>
<style>
:root{color-scheme:dark;--ink:#c7ceca;--muted:#77817b;--cyan:#9aa994;--amber:#b18a62;--red:#a45449}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07090d;color:var(--ink);font-family:Consolas,"Malgun Gothic",monospace;overflow:hidden}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#172129 0,#0a0d12 58%,#050608 100%)}
#frame{position:relative;width:min(100vw,177.777vh);aspect-ratio:16/9;border:1px solid #333a35;box-shadow:0 0 65px #000,0 0 20px #75d7d011;overflow:hidden;background:#090d12}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#shade{pointer-events:none;position:absolute;inset:0;background:radial-gradient(ellipse at center,#0000 42%,#000a 100%);mix-blend-mode:multiply}
#dialog{position:absolute;left:6%;right:6%;bottom:7%;padding:19px 23px 16px;background:linear-gradient(100deg,#0a100fF2,#111511e8);border:1px solid #50594c;border-left:4px solid #65745b;box-shadow:0 8px 35px #000b;display:none}
#dialog:after{content:"";position:absolute;right:0;bottom:0;width:92px;height:18px;background:linear-gradient(145deg,transparent 47%,#354438 49% 65%,transparent 67%),radial-gradient(ellipse at 82% 100%,#456044aa 0 25%,transparent 27%);pointer-events:none}
#dialog.terminal-log{left:4%;right:auto;bottom:5%;width:min(680px,92%);padding:15px 19px 13px;background:linear-gradient(100deg,#08100ff5,#0c1111f0);border-color:#46564d;border-left-color:#82917a;box-shadow:0 10px 38px #000d,inset 0 0 25px #9cae8708}
#dialog.terminal-log #speaker{color:#a4b099;font-size:11px}
#dialog.terminal-log #line{font-size:clamp(13px,1.65vw,16px);line-height:1.8;min-height:5.4em;color:#c2c9bc}
#dialog.terminal-log #line.typing:after{content:"▍";color:#9daa82;animation:terminal-cursor .8s steps(1) infinite}
#dialog.terminal-log #advance{color:#8d9d86}
@keyframes terminal-cursor{50%{opacity:0}}
#speaker{font-size:12px;letter-spacing:.15em;color:#9aa994;margin-bottom:9px}#line{font-size:clamp(14px,2.1vw,20px);line-height:1.65;min-height:3.2em;white-space:pre-wrap}#advance{display:block;margin:9px 0 0 auto;border:0;background:none;color:var(--amber);font:inherit;font-size:12px;cursor:pointer}
#hint{position:absolute;right:15px;top:12px;max-width:70%;color:#aab1a6;font-size:10px;letter-spacing:.02em;text-shadow:0 1px #000;text-align:right}
@media(max-width:650px){#dialog{left:3%;right:3%;bottom:4%;padding:12px 14px}#line{font-size:14px}#hint{font-size:9px}}
</style>
</head>
<body>
<main id="frame" aria-label="LAST SPARK 로컬 게임">
<canvas id="game" width="960" height="540" aria-label="게임 화면"></canvas>
<div id="shade"></div><div id="hint">A/D · ←→ 이동　SPACE 점프　J 길게 차징　SHIFT 대시　R 회복약　E 조사·은폐　O 손전등　ESC 일시정지　Q 타이틀</div>
<section id="dialog" role="dialog" aria-live="polite"><div id="speaker">기록</div><div id="line"></div><button id="advance">계속　[ENTER]</button></section>
</main>
<script src="asset-manifest.js"></script>
<script src="presentation.js"></script>
<script src="asset-runtime.js"></script>
<script src="combat.js"></script>
<script src="player-appearance.js"></script>
<script src="world.js"></script>
<script src="lighting.js"></script>
<script src="research.js"></script>
<script src="boss-ai.js"></script>
<script src="sound.js"></script>
<script>
(()=>{
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),dialog=document.querySelector('#dialog'),speakerEl=document.querySelector('#speaker'),lineEl=document.querySelector('#line'),advanceEl=document.querySelector('#advance');
 const W=960,H=540,FLOOR=448,MAX_ACTIVE_ENEMIES=5,ROOM_WIDTHS=[1536,1536,960,960,1200],RESEARCH_DOOR_X=1010,RESEARCH_RETURN_X=105,GENERATOR_LAYOUT=[{id:'g1',room:4,floor:1,x:760},{id:'g2',room:4,floor:2,x:620},{id:'g3',room:4,floor:3,x:820}],keys=new Set(),rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const game={mode:'title',room:0,researchFloor:1,world:LastSparkWorld.create(ROOM_WIDTHS,GENERATOR_LAYOUT),cameraX:0,player:{x:112,y:FLOOR,vx:0,vy:0,hp:100,max:100,potions:2,face:1,ground:true,jumps:0,stun:0,invuln:0,dash:0,dashCd:0,attack:0,attackCooldown:0,attackElapsed:0,attackHit:false,attackCharged:false,attackHeld:false,chargeTime:0,charging:false,hidden:false,coverId:null},flags:{log:false,card:false},researchWingVisits:0,enemies:[],shots:[],hazards:[],effects:[],boss:null,turrets:[],dropQueue:[],deployments:{},deploymentCount:0,aiNode:null,toast:'',toastTime:0,score:0,maxPhase:1,dialogue:[],dialogueIndex:0,afterDialogue:null,dialogueTypewriter:false,dialogueVisibleChars:0,dialogueElapsed:0,clock:0,flicker:0,attackClock:1.4,muted:false,wireSparks:[],wireSparkKey:'',alarmPulseUntil:0,nextAlarmAt:0,alarmStartedAt:0,nextMotorAt:0,flashlightOn:true,powerRestoreAt:-10};
let audio=null,hum=null,audioGain=null,noiseSource=null,noiseGain=null,noiseFilter=null,droneFilter=null,last=0;
function phase(){const p=game.player;return p.hp/p.max>.7?1:p.hp/p.max>.3?2:3}
function tell(msg,t=2.4){game.toast=msg;game.toastTime=t}
function cameraImpulse(strength){const activeStrength=game.cameraShakeTime>0?game.cameraShakeStrength||0:0;game.cameraShakeStrength=Math.max(activeStrength,Math.min(3,strength));game.cameraShakeTime=.1;game.cameraShake=game.cameraShakeStrength}
function emitFx(name,x,y,duration=.55,scale=1,flip=false){game.effects.push({name,x,y,started:game.clock,duration,scale,flip})}
function say(who,lines,after=null,options={}){game.mode='dialogue';game.dialogue=lines;game.dialogueIndex=0;game.afterDialogue=after;game.dialogueTypewriter=options.typewriter===true;game.dialogueElapsed=0;game.dialogueVisibleChars=game.dialogueTypewriter?0:(lines[0]||'').length;dialog.style.display='block';dialog.classList.toggle('terminal-log',game.dialogueTypewriter);speakerEl.textContent=who;lineEl.textContent=game.dialogueTypewriter?'':(lines[0]||'');lineEl.classList.toggle('typing',game.dialogueTypewriter);advanceEl.textContent=game.dialogueTypewriter?'ENTER: 전체 표시':'계속 [ENTER]'}
function advance(){if(game.mode!=='dialogue')return;if(game.dialogueTypewriter&&game.dialogueVisibleChars<(game.dialogue[game.dialogueIndex]||'').length){game.dialogueVisibleChars=(game.dialogue[game.dialogueIndex]||'').length;lineEl.textContent=game.dialogue[game.dialogueIndex]||'';lineEl.classList.remove('typing');advanceEl.textContent='ENTER: 닫기';return}if(game.dialogueIndex<game.dialogue.length-1){game.dialogueIndex++;game.dialogueElapsed=0;game.dialogueVisibleChars=game.dialogueTypewriter?0:(game.dialogue[game.dialogueIndex]||'').length;lineEl.textContent=game.dialogueTypewriter?'':(game.dialogue[game.dialogueIndex]||'');lineEl.classList.toggle('typing',game.dialogueTypewriter);advanceEl.textContent=game.dialogueTypewriter?'ENTER: 건너뛰기':'계속 [ENTER]';return}dialog.style.display='none';dialog.classList.remove('terminal-log');lineEl.classList.remove('typing');advanceEl.textContent='계속 [ENTER]';game.dialogueTypewriter=false;game.mode='play';const f=game.afterDialogue;game.afterDialogue=null;if(f)f()}
document.querySelector('#advance').addEventListener('click',advance);
function applyAudioMix(power=game.world.powerLevel){if(!audio)return;const mix=LastSparkPresentation.audioLevels(power),time=audio.currentTime;if(audioGain)audioGain.gain.setTargetAtTime(game.muted?0:mix.drone,time,.32);if(noiseGain)noiseGain.gain.setTargetAtTime(game.muted?0:mix.noise,time,.42)}
function playSfx(name){if(audio&&!game.muted)LastSparkSound.play(audio,name)}
function startAudio(){if(game.muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(!hum){hum=audio.createOscillator();droneFilter=audio.createBiquadFilter();audioGain=audio.createGain();audioGain.gain.value=0;hum.type='sawtooth';hum.frequency.value=48;droneFilter.type='lowpass';droneFilter.frequency.value=92;hum.connect(droneFilter).connect(audioGain).connect(audio.destination);hum.start()}if(!noiseSource){const buffer=audio.createBuffer(1,audio.sampleRate,audio.sampleRate),samples=buffer.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=Math.random()*2-1;noiseSource=audio.createBufferSource();noiseSource.buffer=buffer;noiseSource.loop=true;noiseFilter=audio.createBiquadFilter();noiseFilter.type='highpass';noiseFilter.frequency.value=760;noiseFilter.Q.value=.5;const upper=audio.createBiquadFilter();upper.type='lowpass';upper.frequency.value=7600;noiseGain=audio.createGain();noiseGain.gain.value=0;noiseSource.connect(noiseFilter).connect(upper).connect(noiseGain).connect(audio.destination);noiseSource.start()}applyAudioMix()}catch(_){game.muted=true;tell('오디오를 사용할 수 없어 무음으로 시작합니다')}}
window.playLastSparkUiClick=()=>{startAudio();playSfx('uiClick')};
function toggleAudio(){game.muted=!game.muted;if(!game.muted)startAudio();applyAudioMix();tell(game.muted?'환경음 꺼짐':'환경음 켜짐')}
 function resetRun(){game.room=0;game.researchFloor=1;game.world=LastSparkWorld.create(ROOM_WIDTHS,GENERATOR_LAYOUT);applyAudioMix(0);game.wireSparkKey='';game.wireSparks=[];game.alarmPulseUntil=0;game.nextAlarmAt=0;game.alarmStartedAt=0;game.nextMotorAt=0;game.flashlightOn=true;game.powerRestoreAt=-10;game.cameraX=0;game.cameraShake=0;game.cameraShakeStrength=0;game.cameraShakeTime=0;game.player={x:112,y:FLOOR,vx:0,vy:0,hp:100,max:100,potions:2,face:1,ground:true,jumps:0,injected:false,injectionPending:false,hitFlash:0,stun:0,invuln:0,dash:0,dashCd:0,attack:0,attackCooldown:0,attackElapsed:0,attackHit:false,attackCharged:false,attackHeld:false,chargeTime:0,charging:false,hidden:false,coverId:null};game.flags={log:false,card:false};game.researchWingVisits=0;game.score=0;game.maxPhase=1;game.enemies=[];game.shots=[];game.hazards=[];game.effects=[];game.boss=null;game.turrets=[];game.dropQueue=[];game.deployments={};game.deploymentCount=0;game.aiNode=null;game.aiTransferAt=game.clock+4;game.mode='play';loadRoom(0)}
function start(){startAudio();playSfx('uiClick');resetRun()}
function loadRoom(n,researchFloor=1){game.room=n;game.researchFloor=n===4?clamp(Math.floor(researchFloor),1,3):1;game.wireSparkKey='';game.player.x=90;game.player.y=FLOOR;game.player.vx=0;game.player.vy=0;game.player.stun=0;game.player.hidden=false;game.player.coverId=null;game.enemies=[];game.shots=[];game.hazards=[];game.effects=[];game.boss=null;game.turrets=[];game.cameraX=0;game.attackClock=1.5;
 if(n===0){game.enemies.push(makeDrone(740,'ranged',260,920),makeDrone(1220,'melee',1010,1450));tell('분석실 — 순찰 신호 2기')}
 if(n===1){game.enemies.push(makeDrone(640,'melee',440,900),makeDrone(805,'charger',680,1320),makeDrone(1180,'ranged',940,1450));tell('격리 통로 — 보안 유닛 3기 순찰 중')}
if(n===4){const floorPlan=LastSparkResearch.floor(game.researchFloor);floorPlan.patrols.forEach((guard,index)=>game.enemies.push(makeDrone(guard.x,guard.kind,180+index*120,1020+index*80)));const turret=makeTurret(game.researchFloor===2?780:600);game.turrets.push(turret);game.enemies.push(turret);const entryKey='floor:'+game.researchFloor;if(!game.deployments[entryKey]){game.deployments[entryKey]=true;scheduleResearchDrop('층 진입')}tell('E-04 / '+game.researchFloor+'층 — '+floorPlan.name)}
if(n===2){game.boss={kind:'sentinel',x:715,hp:180,max:180,phase:1,w:72,h:112,attackClock:2.1,pattern:0,animKey:'Entrance',animAt:game.clock};tell('중간 보스 — 경비 프레임 / 2단계')}
if(n===3){game.aiNode='nexus';game.boss={kind:'nexus',x:650,hp:360,max:360,phase:1,w:118,h:168,attackClock:2.2,pattern:0,animKey:'Awakening',animAt:game.clock};say('NEXUS / 중앙 제어실',[
game.world.powerLevel===3?'“세 개 차단기를 올렸군요. 격벽 개방까지 12초가 필요합니다.”':`“복구율 ${game.world.powerLevel}/3. 수동 개방은 가능하지만, 경비 전력은 남아 있습니다.”`,
'“그동안 문을 열면, 대피 인원이 위험에 노출됩니다.”',
'“대피 인원은 이미 없습니다.”',
'“확인되지 않은 인원은 위험 인원과 동일하게 처리합니다.”',
'기계음이 끊긴다. 코어 냉각팬이 한 번 돌고 멈춘다.'
])}
}
function makeDrone(x,kind='ranged',patrolMin=x-150,patrolMax=x+150){const charger=kind==='charger';return{x,y:FLOOR,dropY:null,hp:charger?70:58,max:charger?70:58,vx:0,cd:rand(1.1,2.1),flash:0,kind,facing:-1,width:48,height:80,patrolMin,patrolMax,speed:kind==='charger'?48:kind==='melee'?37:32,patrolHomeFacing:-1,alerted:false,noticeUntil:0,noticeAlarm:false,lastSeenX:x,searchUntil:0,aim:0,windup:0,attackTime:0,attackHit:false,charge:0,chargeWarn:0,chargeHit:false,recovery:0}}
function makeTurret(x){return{x,y:FLOOR,dropY:null,dropSpeed:0,hp:48,max:48,vx:0,cd:rand(2.1,3.1),flash:0,kind:'turret',facing:-1,width:76,height:68,patrolMin:x,patrolMax:x,speed:0,alerted:false,noticeUntil:0,noticeAlarm:false,lastSeenX:x,searchUntil:0,aim:0,windup:0,attackTime:0,attackHit:false}}
function startResearchAlarm(){game.alarmPulseUntil=Math.max(game.alarmPulseUntil,game.clock+6);game.alarmStartedAt=game.clock;game.nextAlarmAt=game.clock+.95;playSfx('wingSiren')}
function fireAimedShot(source,speed=250,radius=8){const startX=source.x+(source.facing||1)*18,startY=(source.dropY===null?FLOOR:source.dropY)-48,targetX=game.player.x,targetY=game.player.y-34,dx=targetX-startX,dy=targetY-startY,length=Math.max(1,Math.hypot(dx,dy));game.shots.push({x:startX,y:startY,vx:dx/length*speed,vy:dy/length*speed,life:2.3,from:source.x,radius})}
function fireBossVolley(b){const direction=game.player.x<b.x?-1:1,startX=b.x+direction*b.w*.38,startY=FLOOR-b.h*.64,dx=game.player.x-startX,dy=game.player.y-34-startY,angle=Math.atan2(dy,dx),speed=b.phase===3?340:300;for(const spread of [-.2,0,.2]){const aim=angle+spread;game.shots.push({x:startX,y:startY,vx:Math.cos(aim)*speed,vy:Math.sin(aim)*speed,life:2.2,from:b.x,radius:10,damage:b.phase===3?15:12,boss:true})}}
function scheduleResearchDrop(reason){const floor=game.researchFloor,key='generator:'+floor;if(reason==='generator'&&game.deployments[key])return false;if(reason==='generator')game.deployments[key]=true;const wave=LastSparkResearch.dropWave(floor,LastSparkWorld.roomWidth(game.world,4),game.deploymentCount);const id=++game.deploymentCount;wave.forEach((entry,index)=>game.dropQueue.push({at:game.clock+.8+index*.62,x:entry.x,kind:entry.kind,id,floor}));return true}
 function updateDeployments(){game.dropQueue=game.dropQueue.filter(drop=>{if(drop.at>game.clock||game.room!==4||drop.floor!==game.researchFloor)return true;if(game.enemies.filter(e=>e.hp>0).length>=MAX_ACTIVE_ENEMIES)return false;const enemy=makeDrone(drop.x,drop.kind,Math.max(72,drop.x-240),Math.min(1128,drop.x+240));enemy.dropY=-24;enemy.dropSpeed=470;beginEnemyNotice(enemy,game.player.x,true);game.enemies.push(enemy);return false})}
function objects(){
 const generators=LastSparkWorld.generatorsInRoom(game.world,game.room,game.researchFloor).map(g=>({x:g.x,id:g.id,label:'비상 발전기',key:'generator'}));
 const doorX=LastSparkWorld.roomWidth(game.world,game.room)-90;
 if(game.room===0)return[{x:320,label:'손상된 단말기',key:'log'},{x:RESEARCH_DOOR_X,label:'동력 연구동',key:'wing'},...generators,{x:doorX,label:'보안 구역',key:'door'}];
 if(game.room===1)return[{x:74,label:'A-01 통로로 복귀',key:'return'},...generators,{x:1210,label:'보안 데스크 — 출입 키',key:'card'},{x:doorX,label:'보안 격벽',key:'door'}];
 if(game.room===2)return[{x:doorX,label:'중앙 제어실 문',key:'door'}];
 if(game.room===4){const floor=LastSparkResearch.floor(game.researchFloor);const spots=floor.coverXs.map((x,index)=>({x,label:'은폐 캐비닛',key:'cover',id:'e04-f'+game.researchFloor+'-'+index}));const lift=game.researchFloor===1?[{x:doorX,label:'상층 승강기',key:'elevator-up',floor:2},{x:RESEARCH_RETURN_X,label:'격리 통로로 복귀',key:'return'}]:[{x:RESEARCH_RETURN_X,label:'하층 승강기',key:'elevator-down',floor:game.researchFloor-1},...(game.researchFloor<3?[{x:doorX,label:'상층 승강기',key:'elevator-up',floor:game.researchFloor+1}]:[])];return lift.concat(generators,spots)}
 return[]
}
function changeResearchFloor(target,atRight){game.researchFloor=target;loadRoom(4,target);game.player.x=atRight?LastSparkWorld.roomWidth(game.world,4)-115:120;game.player.face=atRight?-1:1;game.mode='play';const note=target===1?'배수구 물. 덮개엔 최근 손자국.':target===2?'관찰창은 안쪽에서 깨졌다. 잠금 기록 06:09.':'회로명은 지워졌다. NEXUS 선만 새것.';tell('E-04 / '+target+'층 — '+LastSparkResearch.floor(target).name+' · '+note,2.5)}
function interact(){const p=game.player;if(p.hidden){playSfx('uiClick');LastSparkResearch.reveal(p);tell('은폐 위치에서 나왔다',1);return}let obj=objects().filter(o=>Math.abs(o.x-p.x)<75).sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x))[0];if(!obj){tell('조사할 대상이 가까이 없어');return}playSfx('uiClick');
 if(obj.key==='cover'){if(LastSparkResearch.hide(p,obj))tell('숨었다 — 순찰이 지나갈 때까지 움직이지 마',1.8);return}
 if(obj.key==='elevator-up'||obj.key==='elevator-down'){changeResearchFloor(obj.floor,obj.key==='elevator-down');return}
  if(obj.key==='generator'){if(LastSparkWorld.activateGenerator(game.world,obj.id)){const generator=game.world.generators.find(g=>g.id===obj.id);generator.activeAt=game.clock;game.alarmPulseUntil=game.clock+6;game.alarmStartedAt=game.clock;game.nextAlarmAt=game.clock+rand(.2,.5);applyAudioMix(game.world.powerLevel);if(game.world.powerLevel===3){game.flashlightOn=false;game.powerRestoreAt=game.clock;playSfx('powerRestore')}game.aiNode=obj.id;LastSparkResearch.wakeNearby(game.enemies,obj.x,420,game.clock);scheduleResearchDrop('generator');emitFx('VFX_Common_EnergyDischarge',obj.x,FLOOR-42,.32,.34);tell(`차단기 ${game.world.powerLevel}/3 — NEXUS가 투입 신호를 보냈다. 위를 봐.`,2.2)}else tell('발전기가 이미 가동 중이다');return}
 if(obj.key==='log'){game.flags.log=true;say('SECURITY TERMINAL / 02:15',['02:15 — 메인 AI가 비상 통제 권한을 요청했다.\n복도 전력은 차단됐고, 출구 잠금은 유지됐다.\n대피 명령을 내린 연구원 네 명은 ‘위험 자산’으로 기록됐다.'],null,{typewriter:true});return}
 if(obj.key==='card'){if(!game.flags.card){game.flags.card=true;game.score+=100;tell('비상 출입 카드를 획득했다.');return}tell('출입 카드가 등록되어 있다.');return}

function snapshot(){const lastHazard=game.hazards.length?game.hazards[game.hazards.length-1]:null;const lastShot=game.shots.length?game.shots[game.shots.length-1]:null;const visual=playerVisualSelection();return{
 mode:game.mode,room:game.room,researchFloor:game.researchFloor,hidden:game.player.hidden,playerX:game.player.x,roomWidths:[...game.world.roomWidths],powerLevel:game.world.powerLevel,audioLevels:LastSparkPresentation.audioLevels(game.world.powerLevel),alarmPulseUntil:game.alarmPulseUntil,alarmActive:alarmActive(),flashlightOn:game.flashlightOn,darkness:LastSparkLighting.alpha(game.world.powerLevel,0),flashlightRadius:LastSparkLighting.flashlightRadius(game.world.powerLevel),dialogueTypewriter:game.dialogueTypewriter,dialogueVisibleChars:game.dialogueVisibleChars,dialogueLength:(game.dialogue[game.dialogueIndex]||'').length,dialogueText:game.dialogue[game.dialogueIndex]||'',researchWingVisits:game.researchWingVisits,generators:game.world.generators.map(g=>({...g})),
 playerHp:game.player.hp,phase:phase(),phaseSpeed:LastSparkCombat.playerPhaseProfile(phase()).speed,phaseDamageTakenMultiplier:LastSparkCombat.playerPhaseProfile(phase()).damageTakenMultiplier,suitDamageLevel:game.player.suitDamageLevel||0,playerAppearance:visual.appearance,playerVisualTier:visual.tier,playerSprite:visual.name,playerSpriteFrame:visual.frame,potions:game.player.potions,playerInjected:game.player.injected===true,maxJumps:phase()===3&&game.player.injected?3:1,jumps:game.player.jumps,playerAttack:game.player.attack,attackCooldown:game.player.attackCooldown,playerCharging:game.player.charging,playerPose:playerPoseName(game.player,phase()),chargeReady:game.player.chargeTime>=LastSparkCombat.CHARGE_THRESHOLD_SECONDS,chargeMoveMultiplier:LastSparkCombat.chargeMoveMultiplier(game.player.chargeTime),lastAttackCharged:game.lastAttackCharged,dashDuration:game.player.dash,dashCooldown:game.player.dashCd,
 hitstopRemaining:game.hitstop||0,cameraShake:game.cameraShake||0,playerHitFlash:game.player.hitFlash||0,hitFeedbackCharged:game.hitFeedbackCharged===true,meleeImpactRemaining:game.lastImpact?Math.max(0,game.lastImpact.until-game.clock):0,
 card:game.flags.card,objects:objects().map(o=>({key:o.key,x:o.x,label:o.label})),enemyHp:game.enemies.map(e=>e.hp),enemyX:game.enemies.map(e=>e.x),alertedEnemies:game.enemies.filter(e=>e.alerted).length,warningEnemies:game.enemies.filter(e=>e.hp>0&&e.noticeUntil>game.clock).length,airborneEnemies:game.enemies.filter(e=>e.dropY!==null).length,dropQueue:game.dropQueue.length,deploymentCount:game.deploymentCount,turretCount:game.turrets.filter(e=>e.hp>0).length,enemyShotCount:game.shots.length,turretShotVx:lastShot?lastShot.vx:null,turretShotVy:lastShot?lastShot.vy:null,

}}
function dispatchTestKey(key,type){window.dispatchEvent(new KeyboardEvent(type,{key,bubbles:true}))}
function pressKey(key){dispatchTestKey(key,'keydown');dispatchTestKey(key,'keyup');return snapshot()}
function holdKey(key){dispatchTestKey(key,'keydown');return snapshot()}
function releaseKey(key){dispatchTestKey(key,'keyup');return snapshot()}
function step(seconds){update(seconds);return snapshot()}
function moveTestPlayerTo(x){game.player.x=clamp(Number(x),0,LastSparkWorld.roomWidth(game.world,game.room));return snapshot()}
function dismissTestDialogue(){let guard=8;while(game.mode==='dialogue'&&guard-->0)advance();return snapshot()}
function setTestEnemy(distance=145){game.room=0;game.enemies=[makeDrone(game.player.x+distance,'melee')];game.enemies[0].cd=9;return snapshot()}
function setTestTurret(){game.room=4;game.researchFloor=1;game.player.x=300;game.enemies=[];game.shots=[];game.dropQueue=[];game.hazards=[];const turret=makeTurret(600);turret.cd=0;game.turrets=[turret];game.enemies=[turret];game.mode='play';return snapshot()}
function triggerTurretShot(){game.player.x=530;update(.1);update(.9);update(.8);return snapshot()}
function setTestBoss(kind='sentinel',bossPhase=1,playerX=300){game.room=2;game.player.x=playerX;game.enemies=[];game.turrets=[];game.shots=[];game.hazards=[];game.lastBossPattern=null;const nexus=kind==='nexus';game.boss={kind,x:nexus?650:430,hp:nexus?360:180,max:nexus?360:180,phase:bossPhase,w:nexus?118:72,h:nexus?168:112,attackClock:99,pattern:0,counterOpen:0,attackActive:false};return snapshot()}
function triggerBossAttack(){if(!game.boss)return snapshot();game.boss.attackClock=0;game.hazards=[];game.boss.attackActive=false;updateBoss(.016);return snapshot()}
function interactGenerator(id){const generator=game.world.generators.find(g=>g.id===id);if(!generator)return false;game.room=generator.room;game.researchFloor=generator.floor;loadRoom(generator.room,generator.floor);game.player.x=generator.x;game.mode='play';const before=game.world.powerLevel;dispatchTestKey('e','keydown');dispatchTestKey('e','keyup');return game.world.powerLevel>before}
function travelResearchFloor(target){if(game.room!==4||target<1||target>3||Math.abs(target-game.researchFloor)!==1)return false;changeResearchFloor(target,target<game.researchFloor);return game.researchFloor===target}
function hideAtCover(){if(game.room!==4)return false;const cover=objects().find(o=>o.key==='cover');if(!cover)return false;game.player.x=cover.x;interact();return game.player.hidden}
function enterResearchWing(dismissDialogue=true){if(game.room!==0)return false;game.flags.log=true;game.flags.card=true;game.enemies=[];game.player.x=RESEARCH_DOOR_X;game.mode='play';dispatchTestKey('e','keydown');dispatchTestKey('e','keyup');if(game.room===4){if(dismissDialogue)dismissTestDialogue();return true}return false}
function exitResearchWing(){if(game.room!==4)return false;game.enemies=[];while(game.researchFloor>1){const next=game.researchFloor-1;changeResearchFloor(next,true);game.enemies=[];game.player.x=RESEARCH_RETURN_X}game.player.x=RESEARCH_RETURN_X;game.mode='play';dispatchTestKey('e','keydown');dispatchTestKey('e','keyup');if(game.room===0){game.mode='play';dialog.style.display='none';return true}return false}
function setTestPlayerHp(value){game.player.hp=clamp(Number(value)||1,1,game.player.max);game.player.suitDamageLevel=Math.max(game.player.suitDamageLevel||0,phase()-1);return snapshot()}
function enterNextDoor(){if(game.room>1)return false;game.flags.log=true;game.flags.card=true;game.player.x=LastSparkWorld.roomWidth(game.world,game.room)-90;dispatchTestKey('e','keydown');dispatchTestKey('e','keyup');if(game.room>0){game.mode='play';dialog.style.display='none';return true}return false}
