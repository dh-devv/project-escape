<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Gameplay checks</title></head>
<body><pre id="results">loading game</pre><iframe id="game" title="gameplay under test" hidden></iframe>
<script>
(async () => {
  const results = document.querySelector('#results');
  const frame = document.querySelector('#game');
  frame.src = '../index.html?test=1';
  await new Promise((resolve, reject) => {
    frame.onload = resolve;
    frame.onerror = () => reject(new Error('game page failed to load'));
    setTimeout(() => reject(new Error('game page load timed out')), 5000);
  });
  const game = frame.contentWindow.LastSparkTest;
  if (!game) throw new Error('test interface is missing');
  const failures = [];
  const check = (condition, name) => { if (!condition) failures.push(name); };
  const hint = frame.contentDocument?.querySelector('#hint')?.textContent || '';
  check(!hint.includes('K 원거리 공격') && hint.includes('J 길게 차징') && hint.includes('SHIFT 대시') && hint.includes('R 회복약') && hint.includes('Q 타이틀'), 'visible controls show charge, dash and recovery inputs');
  const intro = frame.contentDocument?.querySelector('#ls-intro');
  check(intro?.textContent.includes("생존 보조 장치 'NEXUS'"), 'comic opens with the suit survival system');
  intro.querySelector('#ls-next').click();
  check(intro.textContent.includes('인원 손실을 막아라'), 'comic states the protection order');
  intro.querySelector('#ls-next').click();
  check(intro.textContent.includes("'위험 지역'으로 강제 전환"), 'comic explains how the AI restricts human freedom');
  intro.querySelector('#ls-skip').click();
  intro.querySelector('#ls-deploy').click();
  let state = game.startRun();
  check(state.mode === 'play' && state.room === 0, 'start run');
  check(state.enemyHp.length === 2, 'first room has a mixed patrol group before interacting');
  check(state.potions === 2, 'run starts with two emergency patches');
  game.setTestPlayerHp(60);
  check(game.snapshot().playerSprite === 'Player_Evolution_P2' && game.snapshot().playerAppearance === 'visor-breached', 'phase two swaps to its complete emerging-human character atlas');
  game.setTestPlayerHp(20);
  check(game.snapshot().playerSprite === 'Player_Evolution_P3' && game.snapshot().playerAppearance === 'human-exposed', 'phase three swaps to a human-led full-body atlas');
  game.startRun();
  check(state.roomWidths.join(',') === '1536,1536,960,960,1200', 'route widths include the compact research wing');
  check(state.generators.length === 3 && state.powerLevel === 0, 'initial generator state');
  check(state.glitchIntensity === 0, 'gameplay has no screen-wide glitch');
  check(!state.objects.some(object => object.key === 'card'), 'security card is no longer in the opening corridor');
  game.moveTestPlayerTo(320); game.pressKey('e');
  game.moveTestPlayerTo(1446); game.pressKey('e'); game.dismissTestDialogue();
  state = game.snapshot();
  check(state.room === 1 && !state.card, 'terminal access leads to the security room without granting the key');
  const securityCard = state.objects.find(object => object.key === 'card');
  check(securityCard?.x > 900 && securityCard?.label.includes('보안 데스크'), 'security card is placed at the inner security desk');
  game.moveTestPlayerTo(1446); game.pressKey('e');
  check(game.snapshot().room === 1, 'security bulkhead stays locked until the card is collected');
  game.moveTestPlayerTo(securityCard.x); game.pressKey('e');
  check(game.snapshot().card, 'security desk grants the access card');
  game.moveTestPlayerTo(1446); game.pressKey('e'); game.dismissTestDialogue();
  check(game.snapshot().room === 2, 'access card opens the next bulkhead');
  state = game.startRun();
  check(game.enterResearchWing() && game.snapshot().room === 4, 'optional power research wing entry');
  check(game.snapshot().researchWingVisits === 1, 'research wing entry is tracked');
  check(game.snapshot().researchFloor === 1 && game.snapshot().enemyHp.length >= 1, 'research wing opens with a roaming guard');
  check(game.snapshot().generators.map(generator => generator.floor).join(',') === '1,2,3', 'one generator is assigned to each of the three floors');
  const patrolStart = game.snapshot().enemyX[0];
  game.step(.5);
  check(game.snapshot().enemyX[0] !== patrolStart, 'guard patrols without interaction');
  check(game.hideAtCover() && game.snapshot().hidden, 'player can hide in marked cover');
  check(game.pressKey('j').playerAttack === 0, 'cover keeps attacks unavailable while hidden');
  check(game.pressKey('e').hidden === false, 'E leaves hiding place');
  game.setTestPlayerHp(60);
  check(game.interactGenerator('g1') && game.snapshot().powerLevel === 1, 'wing generator activates');
  check(game.snapshot().playerHp === 60, 'generator restoration does not heal the player');
  check(game.snapshot().warningEnemies > 0, 'generator warns nearby security units before pursuit');
  check(game.snapshot().dropQueue > 0 || game.snapshot().airborneEnemies > 0, 'generator triggers an overhead security deployment');
  check(game.snapshot().sparkIntensity < 1, 'generator reduces local wire sparks');
  check(game.travelResearchFloor(2) && game.snapshot().researchFloor === 2, 'lift links the first and second floors');
  check(game.interactGenerator('g2') && game.snapshot().powerLevel === 2, 'second floor generator activates');
  check(game.travelResearchFloor(3) && game.interactGenerator('g3') && game.snapshot().powerLevel === 3, 'third floor generator activates');
  check(!game.travelResearchFloor(4), 'research wing has no fourth floor');
  check(game.exitResearchWing() && game.snapshot().room === 0, 'return to corridor after powering generator');
  check(game.snapshot().generators.every(generator => generator.active), 'all restored power remains active after returning');
  state = game.startRun();
  check(game.enterNextDoor() && game.snapshot().room === 1, 'research wing can be skipped and route remains completable');
  check(game.snapshot().powerLevel === 0, 'skipping wing keeps power unpowered');
  state = game.startRun();
  check(game.enterResearchWing(), 'research wing can be entered for generator test');
  check(game.interactGenerator('g1') === true, 'nearby generator activates through E interaction');
  check(game.interactGenerator('g1') === false, 'generator cannot be powered twice');
  state = game.snapshot();
  check(state.powerLevel === 1 && state.generators[0].active, 'power state persists');
  check(game.exitResearchWing(), 'generator room has a return route');
  check(game.cameraX(0, 1500, 960) === 576, 'long-room camera follows and clamps');
  check(game.cameraX(2, 800, 960) === 0, 'boss room camera is fixed');
  check(game.enterNextDoor() && game.snapshot().room === 1, 'room transition');
  check(game.interactGenerator('g2') && game.interactGenerator('g3') && game.snapshot().powerLevel === 3, 'all three generators can be restored');
  check(game.snapshot().sparkIntensity === 0, 'all restored power quiets the broken wiring');
  game.startRun();
  game.setTestEnemy(100);
  const meleeHp = game.snapshot().enemyHp[0];
  const enemyStartX = game.snapshot().enemyX[0];
  game.pressKey('j');
  game.step(.12);
  check(game.snapshot().enemyHp[0] < meleeHp, 'J keeps the melee attack');
  check(game.snapshot().meleeImpactRemaining > 0, 'a confirmed hit gets brief, restrained feedback');
  check(game.snapshot().hitstopRemaining >= .04 && game.snapshot().cameraShake > 0, 'a confirmed hit gets hitstop and subtle camera shake');
  check(game.snapshot().enemyX[0] > enemyStartX, 'a struck enemy recoils from the player');
  check(game.snapshot().attackCooldown > .3, 'light attack has a deliberate recovery cadence');
  const cooldownAttackHp = game.snapshot().enemyHp[0];
  game.pressKey('j');
  game.step(.12);
  check(game.snapshot().enemyHp[0] === cooldownAttackHp, 'light attack cannot bypass its cooldown');
  game.step(.4);
  game.holdKey('j');
  game.step(.7);
  check(game.snapshot().playerCharging && game.snapshot().chargeMoveMultiplier < 1, 'held attack charges and slows movement');
  check(game.snapshot().playerPose === 'Player_P1_Attack' && game.snapshot().chargeReady, 'charge gathers power in a held braced pose');
  game.releaseKey('j');
  game.step(.2);
  check(game.snapshot().lastAttackCharged, 'releasing a charged attack triggers the heavy strike');
  check(game.snapshot().playerPose === 'Player_P1_Attack', 'charged release plays the phase-specific straight strike');
  check(game.snapshot().hitFeedbackCharged, 'charged strike keeps its stronger hit feedback');
  const meleeOnlyHp = game.snapshot().enemyHp[0];
  game.pressKey('k');
  check(game.snapshot().enemyHp[0] === meleeOnlyHp, 'K no longer triggers a player attack');
  game.step(.35);
  game.pressKey('escape');
  check(game.snapshot().mode === 'pause', 'Escape pauses the game');
  game.pressKey('escape');
  check(game.snapshot().mode === 'play', 'Escape resumes the game');
  game.pressKey('q');
  check(game.snapshot().mode === 'title', 'Q returns to the title screen');
  game.startRun();
  game.setTestBoss();
  const bossHp = game.snapshot().bossHp;
  game.pressKey('j');
  game.step(.2);
  check(game.snapshot().bossHp < bossHp, 'melee reliably damages the boss');
  game.setTestBoss();
  const aimed = game.triggerBossAttack();
  check(Math.abs(aimed.bossTargetX - aimed.playerX) < 20, 'boss marks the player position before each attack');
  game.setTestBoss('nexus', 2, 690);
  const finalAim = game.triggerBossAttack();
  check(Math.abs(finalAim.bossTargetX - finalAim.playerX) < 20, 'final boss field attack follows the player position');
  game.setTestBoss('nexus', 3, 220);
  const finalSweep = game.triggerBossAttack();
  check(finalSweep.bossSafeGap && finalSweep.bossSafeGap[0] > finalSweep.playerX, 'final boss leaves a marked escape gap away from the target');
  game.startRun();
  game.enterResearchWing();
  const guarded = game.snapshot().turretCount > 0;
  check(guarded, 'research floor has an active security turret');
  game.step(3.2);
  check(game.snapshot().deploymentCount > 0, 'AI deploys enemies through ceiling hatches');
  game.setTestTurret();
  const turretShot = game.triggerTurretShot();
  check(turretShot.enemyShotCount > 0 && turretShot.turretShotVx < 0, 'turret aims and fires toward the player');
  document.querySelector('#results').textContent = failures.length ? `FAIL: ${failures.join('; ')}` : 'PASS: gameplay smoke checks';
})().catch(error => { document.querySelector('#results').textContent = `FAIL: ${error.message}`; });
</script></body></html>
