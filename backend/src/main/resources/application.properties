spring.application.name=backend

# MySQL connection values are supplied by the deployment environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/last_spark?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The schema is managed by database/schema.sql. Use "update" only for local development.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
