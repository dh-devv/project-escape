# Standalone AWS configuration. Do not combine with docker-compose.yml.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: last_spark
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in deployment/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deployment/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deployment/.env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" last_spark -e "SELECT 1 FROM users LIMIT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/last_spark?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in deployment/.env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deployment/.env}
      JPA_DDL_AUTO: validate
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in deployment/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
