services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lastspark_game
      MYSQL_USER: lastspark_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in game/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in game/.env}
    volumes:
      - lastspark_mysql:/var/lib/mysql
      - ./server/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 4s
      retries: 20

  api:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: lastspark_game
      DB_USER: lastspark_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in game/.env}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  lastspark_mysql:
